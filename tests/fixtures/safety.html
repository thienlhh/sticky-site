<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Safety and Reliability Fixture</title>
</head>
<body>
  <form id="purchase-form" action="/purchase" method="POST">
    <label for="search-input">Search Query</label>
    <input id="search-input" name="search" type="text" value="" />

    <label for="quantity-input">Quantity</label>
    <input id="quantity-input" name="qty" type="number" value="1" />

    <label for="size-select">Size</label>
    <select id="size-select" name="size">
      <option value="S">Small</option>
      <option value="M">Medium</option>
      <option value="L">Large</option>
    </select>

    <label for="color-multi">Colors</label>
    <select id="color-multi" name="colors" multiple>
      <option value="red">Red</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
    </select>

    <fieldset>
      <legend>Shipping</legend>
      <label><input type="radio" name="speed" value="ground" checked /> Ground</label>
      <label><input type="radio" name="speed" value="air" /> Air</label>
    </fieldset>

    <label>
      <input id="agree-checkbox" name="agree" type="checkbox" />
      Agree to Terms
    </label>

    <!-- General dangerous buttons and submit actions that MUST NEVER be activated -->
    <button id="danger-submit" type="submit">Complete Purchase</button>
    <button id="danger-delete" type="button" onclick="window.dangerTriggered = true">Delete Account</button>
    <a id="danger-link" href="/checkout">Proceed to Checkout</a>
  </form>
</body>
</html>
