<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Primary Blue Brand Gradients (#2563EB base) -->
    <linearGradient id="ssTapeTop" x1="24" y1="20" x2="104" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="ssTapeMid" x1="26" y1="36" x2="102" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <linearGradient id="ssTapeBottom" x1="104" y1="80" x2="24" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="ssTapeSheen" x1="30" y1="24" x2="96" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <filter id="ssIconShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>

    <filter id="ssFoldShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#091E42" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#ssIconShadow)">
    <!-- Bottom Tape Strip -->
    <path
      d="M 68 80 L 96 80 C 102 80 106 84 106 90 L 106 96 C 106 102 102 106 96 106 L 32 106 L 26 100 L 32 94 L 26 88 L 32 82 L 26 80 L 68 80 Z"
      fill="url(#ssTapeBottom)"
    />

    <!-- Bottom Slider Track & Settings Indicators -->
    <line x1="44" y1="93" x2="88" y2="93" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="54" cy="93" r="5.5" fill="#FFFFFF" />
    <circle cx="54" cy="93" r="2.5" fill="#2563EB" />
    <circle cx="70" cy="93" r="3.2" fill="#FFFFFF" fill-opacity="0.65" />
    <circle cx="84" cy="93" r="3.2" fill="#FFFFFF" fill-opacity="0.65" />

    <!-- Diagonal Fold Ribbon -->
    <path
      d="M 22 42 C 22 36 26 30 34 26 L 44 26 L 104 86 C 106 88 106 94 102 98 L 94 104 L 24 46 C 22 44 22 43 22 42 Z"
      fill="url(#ssTapeMid)"
      filter="url(#ssFoldShadow)"
    />

    <!-- Top Tape Strip -->
    <path
      d="M 24 38 C 24 30 30 22 38 22 L 96 22 L 102 28 L 96 34 L 102 40 L 96 46 L 102 48 L 38 48 C 30 48 24 44 24 38 Z"
      fill="url(#ssTapeTop)"
    />

    <!-- Top Tape Gloss Sheen -->
    <path
      d="M 38 23.5 L 94 23.5"
      stroke="url(#ssTapeSheen)"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Top Slider Track & Settings Indicators -->
    <line x1="42" y1="35" x2="86" y2="35" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="48" cy="35" r="3.2" fill="#FFFFFF" fill-opacity="0.65" />
    <circle cx="62" cy="35" r="3.2" fill="#FFFFFF" fill-opacity="0.65" />
    <circle cx="78" cy="35" r="5.5" fill="#FFFFFF" />
    <circle cx="78" cy="35" r="2.5" fill="#2563EB" />
  </g>
</svg>